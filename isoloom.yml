# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# WackoPicko (by Adam Doupe) as an Isoloom spec: the PHP photo-sharing site, vendored unchanged
# in build/web/app/, built by its own Dockerfile on a rebuilt copy of its tutum/lamp base (which
# Docker can no longer pull). Apache, PHP 5 and MySQL share the one container, as upstream has
# them. `isoloom generate`, then `isoloom up docker`.
version: 1
name: wackopicko

networks:
  lab: { cidr: 10.60.20.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the site answers
    http: http://web/
    wait: 180
  - name: the login page answers
    http: http://web/users/login.php
  - name: the seeded user logs in
    script: checks/login.sh
  - name: the login form is injectable
    script: checks/sqli-login.sh

message: |
  WackoPicko answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Log in as scanner1 / scanner1 (or register), then look at the guestbook, the search and the
  picture upload.
